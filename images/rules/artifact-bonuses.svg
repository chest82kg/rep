<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="system-ui, sans-serif">
  <rect width="800" height="260" fill="#12121a" rx="12"/>
  
  <!-- Заголовок -->
  <text x="20" y="30" fill="#d1b384" font-size="16" font-weight="700">АРТЕФАКТЫ: БОНУСЫ</text>
  <text x="20" y="50" fill="#a0a0b0" font-size="12">Изменяют текущее и максимальное значение ХП, а также складываются с другими бонусами</text>
  
  <!-- Левая карточка: ДО -->
  <g transform="translate(40, 80)">
    <rect width="300" height="140" fill="#1a1a2a" stroke="#2a2a3a" stroke-width="2" rx="8"/>
    <text x="150" y="25" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ЖЕЛЕЗНОБОРОД-ВОИН</text>
    <text x="150" y="42" fill="#a0a0b0" font-size="10" text-anchor="middle">Базовый отряд</text>
    
    <!-- Статы ДО -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" fill="#a0a0b0" font-size="11">ХП:</text>
      <text x="30" y="0" fill="#d1b384" font-size="14" font-weight="700">6</text>
      
      <text x="0" y="25" fill="#a0a0b0" font-size="11">Броня:</text>
      <text x="45" y="25" fill="#d1b384" font-size="14" font-weight="700">3</text>
      
      <text x="0" y="50" fill="#a0a0b0" font-size="11">Движение:</text>
      <text x="65" y="50" fill="#d1b384" font-size="14" font-weight="700">3</text>
    </g>
    
    <text x="150" y="130" fill="#a0a0b0" font-size="10" text-anchor="middle">без артефактов</text>
  </g>
  
  <!-- Стрелка -->
  <g transform="translate(355, 140)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#d1b384" stroke-width="3"/>
    <polygon points="40,10 32,5 32,15" fill="#d1b384"/>
    <text x="20" y="0" fill="#d1b384" font-size="10" text-anchor="middle">+ артефакты</text>
  </g>
  
  <!-- Правая карточка: ПОСЛЕ -->
  <g transform="translate(420, 80)">
    <rect width="340" height="140" fill="#1a1a2a" stroke="#d1b384" stroke-width="2" rx="8"/>
    <text x="170" y="25" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">ЖЕЛЕЗНОБОРОД-ВОИН</text>
    <text x="170" y="42" fill="#2ed573" font-size="10" text-anchor="middle">с амулетом и щитом</text>
    
    <!-- Статы ПОСЛЕ -->
    <g transform="translate(20, 60)">
      <text x="0" y="0" fill="#a0a0b0" font-size="11">ХП:</text>
      <text x="30" y="0" fill="#2ed573" font-size="14" font-weight="700">8 (+2)</text>
      <text x="120" y="0" fill="#a0a0b0" font-size="9">🎁 Амулет</text>
      
      <text x="0" y="25" fill="#a0a0b0" font-size="11">Броня:</text>
      <text x="45" y="25" fill="#2ed573" font-size="14" font-weight="700">4 (+1)</text>
      <text x="130" y="25" fill="#a0a0b0" font-size="9">🛡️ Щит</text>
      
      <text x="0" y="50" fill="#a0a0b0" font-size="11">Движение:</text>
      <text x="65" y="50" fill="#d1b384" font-size="14" font-weight="700">3</text>
    </g>
    
    <text x="170" y="130" fill="#2ed573" font-size="10" text-anchor="middle">бонусы складываются</text>
  </g>
</svg>