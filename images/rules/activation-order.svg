<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="system-ui, sans-serif">
  <!-- Фон -->
  <rect width="800" height="220" fill="#12121a" rx="12"/>
  
  <!-- Заголовок -->
  <text x="20" y="30" fill="#d1b384" font-size="16" font-weight="700">ПОРЯДОК АКТИВАЦИИ</text>
  <text x="20" y="50" fill="#a0a0b0" font-size="12">Игроки активируют по одной модели поочерёдно</text>
  
  <!-- Блок 1: Игрок А (Центр = 125) -->
  <g transform="translate(75, 80)">
    <text x="50" y="0" fill="#a29bfe" font-size="13" font-weight="700" text-anchor="middle">Игрок А</text>
    <g transform="translate(0, 20)">
      <rect width="100" height="60" fill="#1a1a2a" stroke="#6c5ce7" stroke-width="2" rx="6"/>
      <circle cx="50" cy="20" r="10" fill="#6c5ce7"/>
      <text x="50" y="24" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="50" y="45" fill="#a0a0b0" font-size="10" text-anchor="middle">Модель 1</text>
    </g>
  </g>
  
  <!-- Стрелка 1 (Центр = 215) -->
  <g transform="translate(200, 120)">
    <path d="M 0 0 L 30 0" stroke="#6c5ce7" stroke-width="2" marker-end="url(#arrow-purple)"/>
  </g>
  
  <!-- Блок 2: Игрок Б (Центр = 305) -->
  <g transform="translate(255, 80)">
    <text x="50" y="0" fill="#d1b384" font-size="13" font-weight="700" text-anchor="middle">Игрок Б</text>
    <g transform="translate(0, 20)">
      <rect width="100" height="60" fill="#1a1a2a" stroke="#d1b384" stroke-width="2" rx="6"/>
      <circle cx="50" cy="20" r="10" fill="#d1b384"/>
      <text x="50" y="24" fill="#0b0b0f" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="50" y="45" fill="#a0a0b0" font-size="10" text-anchor="middle">Модель 1</text>
    </g>
  </g>
  
  <!-- Стрелка 2 (Центр = 395) -->
  <g transform="translate(380, 120)">
    <path d="M 0 0 L 30 0" stroke="#d1b384" stroke-width="2" marker-end="url(#arrow-gold)"/>
  </g>
  
  <!-- Блок 3: Игрок А (Центр = 485) -->
  <g transform="translate(435, 80)">
    <text x="50" y="0" fill="#a29bfe" font-size="13" font-weight="700" text-anchor="middle">Игрок А</text>
    <g transform="translate(0, 20)">
      <rect width="100" height="60" fill="#1a1a2a" stroke="#6c5ce7" stroke-width="2" rx="6"/>
      <circle cx="50" cy="20" r="10" fill="#6c5ce7"/>
      <text x="50" y="24" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="50" y="45" fill="#a0a0b0" font-size="10" text-anchor="middle">Модель 2</text>
    </g>
  </g>
  
  <!-- Стрелка 3 (Центр = 575) -->
  <g transform="translate(560, 120)">
    <path d="M 0 0 L 30 0" stroke="#6c5ce7" stroke-width="2" marker-end="url(#arrow-purple)"/>
  </g>
  
  <!-- Блок 4: Игрок Б (Центр = 665) -->
  <g transform="translate(615, 80)">
    <text x="50" y="0" fill="#d1b384" font-size="13" font-weight="700" text-anchor="middle">Игрок Б</text>
    <g transform="translate(0, 20)">
      <rect width="100" height="60" fill="#1a1a2a" stroke="#d1b384" stroke-width="2" rx="6"/>
      <circle cx="50" cy="20" r="10" fill="#d1b384"/>
      <text x="50" y="24" fill="#0b0b0f" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="50" y="45" fill="#a0a0b0" font-size="10" text-anchor="middle">Модель 2</text>
    </g>
  </g>

  <!-- Маркеры для стрелок -->
  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6c5ce7"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d1b384"/>
    </marker>
  </defs>

  <!-- Подпись внизу -->
  <text x="400" y="200" fill="#a0a0b0" font-size="11" text-anchor="middle">Если у одного игрока закончились модели — второй активирует оставшиеся подряд</text>
</svg>