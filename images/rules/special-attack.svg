<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="system-ui, sans-serif">
  <rect width="800" height="220" fill="#12121a" rx="12"/>
  
  <!-- Заголовок -->
  <text x="20" y="30" fill="#d1b384" font-size="16" font-weight="700">СПЕШКА</text>
  <text x="20" y="50" fill="#a0a0b0" font-size="12">Одно действие дважды + маркер «Усталость»</text>
  
  <!-- Сцена 1: Модель до -->
  <g transform="translate(40, 80)">
    <rect width="140" height="100" fill="#1a1a2a" stroke="#2a2a3a" stroke-width="2" rx="8"/>
    <text x="70" y="20" fill="#a0a0b0" font-size="11" text-anchor="middle">ДО</text>
    
    <!-- Модель -->
    <circle cx="70" cy="55" r="18" fill="#6c5ce7" stroke="#a29bfe" stroke-width="2"/>
    <text x="70" y="60" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⚔</text>
    <text x="70" y="88" fill="#a0a0b0" font-size="10" text-anchor="middle">Модель</text>
  </g>
  
  <!-- Стрелка 1 -->
  <g transform="translate(200, 120)">
    <line x1="0" y1="10" x2="60" y2="10" stroke="#6c5ce7" stroke-width="2"/>
    <polygon points="60,10 52,5 52,15" fill="#6c5ce7"/>
    <text x="30" y="0" fill="#a29bfe" font-size="10" text-anchor="middle">Двойное</text>
    <text x="30" y="35" fill="#a29bfe" font-size="10" text-anchor="middle">действие</text>
  </g>
  
  <!-- Сцена 2: Модель после -->
  <g transform="translate(280, 80)">
    <rect width="140" height="100" fill="#1a1a2a" stroke="#2a2a3a" stroke-width="2" rx="8"/>
    <text x="70" y="20" fill="#a0a0b0" font-size="11" text-anchor="middle">ПОСЛЕ</text>
    
    <circle cx="70" cy="55" r="18" fill="#6c5ce7" stroke="#a29bfe" stroke-width="2"/>
    <text x="70" y="60" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">⚔</text>
    <text x="70" y="88" fill="#a0a0b0" font-size="10" text-anchor="middle">Модель</text>
    
    <!-- Маркер усталости -->
    <g transform="translate(105, 25)">
      <circle cx="0" cy="0" r="10" fill="#ffa502" stroke="#fff" stroke-width="1.5"/>
      <text x="0" y="4" fill="#0b0b0f" font-size="11" font-weight="700" text-anchor="middle">💤</text>
    </g>
  </g>
  
  <!-- Стрелка 2 -->
  <g transform="translate(440, 120)">
    <line x1="0" y1="10" x2="60" y2="10" stroke="#ffa502" stroke-width="2"/>
    <polygon points="60,10 52,5 52,15" fill="#ffa502"/>
    <text x="30" y="0" fill="#ffa502" font-size="10" text-anchor="middle">Усталость</text>
    <text x="30" y="35" fill="#ffa502" font-size="10" text-anchor="middle">+ стойка</text>
  </g>
  
  <!-- Сцена 3: Следующий раунд -->
  <g transform="translate(520, 80)">
    <rect width="240" height="100" fill="#1a1a2a" stroke="#2a2a3a" stroke-width="2" rx="8"/>
    <text x="120" y="20" fill="#a0a0b0" font-size="11" text-anchor="middle">СЛЕДУЮЩИЙ РАУНД</text>
    
    <circle cx="70" cy="55" r="18" fill="#3a3a52" stroke="#a0a0b0" stroke-width="2"/>
    <text x="70" y="60" fill="#a0a0b0" font-size="14" font-weight="700" text-anchor="middle">⚔</text>
    <text x="70" y="88" fill="#a0a0b0" font-size="10" text-anchor="middle">Активируется</text>
    
    <text x="130" y="45" fill="#ff4757" font-size="10">последней</text>
    <text x="130" y="60" fill="#ff4757" font-size="10">среди своих</text>
    <text x="130" y="80" fill="#ff4757" font-size="10">нельзя</text>
    <text x="130" y="95" fill="#ff4757" font-size="10">Спешку</text>
  </g>
</svg>